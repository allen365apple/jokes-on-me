<!DOCTYPE html>

<style>
* { box-sizing: border-box; }
html { scrollbar-color: #ffd0a8 #fff8f2; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  color: #2b2118;
  background:

    radial-gradient(800px 500px at 70% 110%, #ffe3c4 0%, rgba(255,227,196,0) 55%),
    linear-gradient(180deg, #ffffff 0%, #fff7f0 55%, #fff1e3 100%);
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 9vh 28px 56px;
}
.eyebrow {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 6px;
  color: #ff7a29;
  margin-bottom: 14px;
}
h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 72px);
  font-weight: 900;
  letter-spacing: 2px;
  line-height: 1.15;
  background: linear-gradient(115deg, #ff9500 5%, #ff5e3a 55%, #ff9d5c 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub {
  margin-top: 16px;
  font-size: 17px;
  color: #9a826e;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 26px;
  margin-top: 7vh;
}
.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid #ffe2c9;
  border-radius: 26px;
  padding: 34px 32px 30px;
  box-shadow: 0 10px 34px rgba(255, 122, 41, 0.10);
  transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 46px rgba(255, 110, 30, 0.20);
}
.icon {
  width: 62px;
  height: 62px;
  border-radius: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ffb35c 0%, #ff6b35 100%);
  box-shadow: 0 8px 20px rgba(255, 107, 53, 0.35);
}
.icon svg { width: 32px; height: 32px; }
.card h2 {
  margin: 22px 0 10px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 1px;
}
.card p {
  margin: 0;
  font-size: 15.5px;
  line-height: 1.8;
  color: #8d7763;
}
.go {
  display: inline-block;
  margin-top: 22px;
  font-size: 15px;
  font-weight: 700;
  color: #ff6320;
}
.go span {
  display: inline-block;
  transition: transform .25s ease;
}
.card:hover .go span { transform: translateX(6px); }
footer {
  margin-top: 11vh;
  font-size: 13px;
  letter-spacing: 2px;
  color: #c4ab92;
}
</style>
</head>

<div class="wrap">

</html>
