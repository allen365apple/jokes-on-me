<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>績效考核・大螢幕｜支薪好友《向上管理》</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="shared.css?v=20260815j">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  body{overflow:hidden}
  /* 右上角控制列：跟「第幾題」同一排，低調不搶戲、不重疊 */
  .topctrl{margin-left:18px; display:flex; gap:8px; align-items:center; flex-shrink:0}
  .tc-btn{background:transparent; border:1px solid #4a4540; color:#8d867e;
    border-radius:99px; padding:4px 12px; font-size:12px; font-weight:700; white-space:nowrap}
  .tc-btn:hover{color:var(--ink); border-color:var(--muted)}
  .tc-btn kbd{font-family:inherit; font-size:10px; background:#3a3531; border:1px solid #4a4540;
    border-radius:5px; padding:0 5px; margin-left:4px; color:#a89f95}
  .ctrl-overlay{position:fixed; inset:0; background:rgba(20,17,15,.78); z-index:50;
    display:flex; align-items:center; justify-content:center}
  .ctrl-panel{background:var(--panel2); border:1px solid #55504b; border-radius:16px;
    padding:24px; width:min(500px,92vw); box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .ctrl-panel h3{font-size:13px; letter-spacing:.2em; color:var(--muted); margin-bottom:14px}
  .ctrl-panel .status{font-size:16px; font-weight:900; margin-bottom:16px}
  .ctrl-panel .status b{color:var(--gold)}
  .ctrl-panel .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .ctrl-panel .hint{font-size:12px; color:var(--muted); line-height:1.8; border-top:1px solid #55504b; padding-top:12px}
  .ctrl-panel .hint kbd{background:var(--bg2); border:1px solid #5a534e; border-radius:6px; padding:1px 8px; font-family:inherit; font-weight:800; color:var(--ink)}
  .start-cta{margin-top:6px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .start-cta .keyhint{font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div class="stage">
  <div class="stage-head">
    <img class="logo-img" src="logo.jpg" alt="FWB.manzai" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'FWB.manzai'}))">
    <span class="sub" id="stageSub">支薪好友專場互動之《績效考核》</span>
    <span class="qtag" id="qtag"></span>
    <div class="topctrl" id="topCtrl"></div>
  </div>
  <div class="stage-body" id="body">
    <div class="qshow"><h2>連線中⋯</h2></div>
  </div>
</div>
<div class="ctrl-overlay hidden" id="ctrlOverlay">
  <div class="ctrl-panel">
    <h3>控制台（觀眾看不到這裡）</h3>
    <div class="status" id="ovStatus">—</div>
    <div class="row">
      <div class="seg" id="ovSeg">
        <button data-m="auto">同步：自動</button>
        <button data-m="force_realtime">強制 Realtime</button>
        <button data-m="force_polling">強制輪詢</button>
      </div>
    </div>
    <div class="row">
      <button class="btn-ghost" id="ovSkip">緊急略過本階段 ▸</button>
      <button class="btn-ghost" id="ovReset">重置整場（清空玩家）</button>
      <a class="btn-gold" id="ovEditor" target="_blank" style="text-decoration:none; padding:8px 16px; font-size:13px; border-radius:10px">🛠 開啟後台（開新分頁）</a>
    </div>
    <div class="hint">
      快捷鍵：<kbd>Enter</kbd> 開始遊戲／緊急略過（最終排行榜時＝重置再玩一次）・
      <kbd>F</kbd> 切換全螢幕・<kbd>Esc</kbd> 關閉此面板
    </div>
    <div class="row" style="margin:14px 0 0; justify-content:flex-end">
      <button class="btn-gold" id="ovClose">關閉</button>
    </div>
  </div>
</div>
<div class="conn-dot" id="connDot"></div>

<script type="module">
import { CONFIG, rpc, sb, clock, createSync, normalizeState,
         SHAPES, LETTERS, TABLE_IDS, $, esc, secs } from './shared.js?v=20260815j';

const body = $('#body');
// 帶 ?key=主持人金鑰 開啟時，大螢幕本身就是節奏駕駛（可 Enter 開始/略過、⚙ 控制台）
const KEY = new URLSearchParams(location.search).get('key') || '';
const S = {
  session: null, question: null, result: null, rankings: null,
  lobby: null, renderedKey: '', lastJoin: '',
  advancing: false, finalAt: 0,
  review: { active: false, idx: 0, data: null },
};
let sync = null, uiTimer = null, lobbyTimer = null, playersChannel = null;

// 觀眾加入網址（QR code 指向這裡）
const joinUrl = new URL('./?code=' + encodeURIComponent(CONFIG.joinCode), location.href).href;
// 備援網址：預設場次可用短網址；其他場次必須顯示完整網址（含 code），否則會連到錯的場次
function shortJoinUrl() {
  const bare = new URL('./', location.href).href.replace(/^https?:\/\//, '');
  return CONFIG.joinCode === 'FWB520' ? bare : joinUrl.replace(/^https?:\/\//, '');
}

// ── 自動縮字：投影要最大字，但長題目/長選項不能被切掉 ──────
// CSS 先給到最大，這裡量測若超出容器就逐步降級，直到剛好塞得下
function fitText(el, minPx) {
  if (!el) return;
  el.style.fontSize = '';                                   // 先回到 CSS 的最大值
  let size = parseFloat(getComputedStyle(el).fontSize);
  let guard = 80;
  // 容差 6px：行高的四捨五入誤差常有 2-3px，容差太小會誤判而把字縮過頭
  while (el.scrollHeight > el.clientHeight + 6 && size > minPx && guard-- > 0) {
    size = Math.max(minPx, size - Math.max(1, size * 0.05));
    el.style.fontSize = size + 'px';
  }
}
function fitAll() {
  document.querySelectorAll('#body .opt').forEach(el => fitText(el, 22));
  document.querySelectorAll('#body .qtext, #body .qshow h2').forEach(el => fitText(el, 26));
  document.querySelectorAll('#body .top5 li, #body .ranklist .row').forEach(el => fitText(el, 18));
}
// 用 setTimeout 而非 requestAnimationFrame：rAF 在背景分頁不會執行，
// 萬一操作者把瀏覽器切到別的分頁，縮字就會失效
function scheduleFit() { fitAll(); setTimeout(fitAll, 150); }
window.addEventListener('resize', scheduleFit);

// 快捷鍵（開頁即註冊）：F=全螢幕；有控制金鑰時 Enter=開始/略過/重玩、Esc=關控制台
document.addEventListener('keydown', e => {
  if (e.target instanceof Element && e.target.matches('input,textarea,select')) return;
  if (e.key === 'f' || e.key === 'F') { toggleFS(); return; }
  if (!KEY) return;
  if (S.review.active) {   // 回顧模式：← → 翻題、Esc 回排行榜
    if (e.key === 'ArrowLeft') reviewNav(-1);
    else if (e.key === 'ArrowRight' || e.key === 'Enter') reviewNav(1);
    else if (e.key === 'Escape') exitReview();
    return;
  }
  if (e.key === 'Escape') { $('#ctrlOverlay').classList.add('hidden'); return; }
  if (e.key === 'Enter') enterAction();
});

async function boot() {
  try {
    await clock.sync();
    const s = normalizeState(await rpc('get_session_by_code', { p_code: CONFIG.joinCode }));
    sync = createSync({
      sessionId: s.sessionId,
      onState: onSessionState,
      onConn: c => {
        const el = $('#connDot');
        el.textContent = c.realtime ? '● realtime' : '● polling';
        el.classList.toggle('degraded', c.degraded);
      },
    });
    onSessionState(s);
    sync.start();
    watchPlayers(s.sessionId); // 大廳期間玩家加入即時推播
    if (KEY) initController();
  } catch (e) {
    body.innerHTML = `<div class="qshow"><h2>連線失敗：${esc(e.message)}</h2></div>`;
  }
}

// ═══ 控制模式（大螢幕即駕駛）═══════════════════════════════
function initController() {
  $('#ovEditor').href = 'host.html?code=' + encodeURIComponent(CONFIG.joinCode) + '&key=' + encodeURIComponent(KEY);
  // 節奏驅動：階段時間到自動推進
  setInterval(() => {
    const s = S.session;
    if (!s || S.advancing) return;
    let target = null;
    if (s.phase === 'question_show' || s.phase === 'question_result') target = s.phaseUntil;
    if (s.phase === 'question_open') target = s.deadline;
    if (target && clock.now() >= target + 80) advance();
  }, 200);
  // 螢幕保持喚醒
  navigator.wakeLock?.request('screen').catch(() => {});
  // ⚙ 控制台（快捷鍵已在開頁時全域註冊）
  $('#ovClose').addEventListener('click', () => $('#ctrlOverlay').classList.add('hidden'));
  $('#ovSkip').addEventListener('click', () => { advance(); $('#ctrlOverlay').classList.add('hidden'); });
  $('#ovReset').addEventListener('click', () => {
    if (confirm('確定重置？會清空所有玩家與作答紀錄，回到大廳。')) { resetGame(); $('#ctrlOverlay').classList.add('hidden'); }
  });
  $('#ovSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
    try {
      const st = normalizeState(await rpc('host_set_sync_mode',
        { p_code: CONFIG.joinCode, p_secret: KEY, p_mode: b.dataset.m }));
      onSessionState(st);
    } catch (e) { alert(e.message); }
  }));
}
// Enter 或控制列按鈕的動作：大廳=開始、遊戲中=略過、結算=重置再玩
function enterAction() {
  const s = S.session; if (!s || !KEY || S.review.active) return;
  if (s.phase === 'final_ranking') {
    if (Date.now() - S.finalAt > 3000) resetGame(); // 剛進結算 3 秒內防誤觸
  } else advance();
}
// 右上角控制列：依階段換字，全螢幕鍵永遠在
function renderTopCtrl() {
  const el = $('#topCtrl'); if (!el) return;
  const s = S.session;
  let h = '';
  if (KEY && s) {
    const label = s.phase === 'lobby' ? '開始遊戲'
                : s.phase === 'final_ranking' ? '重置再玩一次' : '略過本階段';
    h += `<button class="tc-btn" id="tcNext">${label}<kbd>Enter</kbd></button>`;
    h += `<button class="tc-btn" id="tcPanel">⚙ 控制台</button>`;
  }
  if (document.documentElement.requestFullscreen) h += `<button class="tc-btn" id="tcFS">全螢幕<kbd>F</kbd></button>`;
  el.innerHTML = h;
  $('#tcNext')?.addEventListener('click', enterAction);
  $('#tcPanel')?.addEventListener('click', () => { $('#ctrlOverlay').classList.remove('hidden'); updateOverlay(); });
  $('#tcFS')?.addEventListener('click', toggleFS);
}
async function advance() {
  if (!KEY || S.advancing) return;
  S.advancing = true;
  try {
    let st;
    try {
      st = await rpc('host_advance', { p_code: CONFIG.joinCode, p_secret: KEY,
        p_from_phase: S.session.phase, p_from_qindex: S.session.qindex });
    } catch (e) {
      // 資料庫尚未套用新版 host_advance 時退回舊簽名
      if (/host_advance/.test(e.message)) st = await rpc('host_advance', { p_code: CONFIG.joinCode, p_secret: KEY });
      else throw e;
    }
    onSessionState(normalizeState(st));
  } catch (e) { console.warn('advance 失敗', e.message); }
  finally { S.advancing = false; }
}
async function resetGame() {
  if (!KEY) return;
  try {
    const st = normalizeState(await rpc('host_reset', { p_code: CONFIG.joinCode, p_secret: KEY }));
    S.question = null; S.result = null; S.rankings = null; S.renderedKey = ''; S.lastJoin = '';
    onSessionState(st);
  } catch (e) { alert('重置失敗：' + e.message); }
}
function updateOverlay() {
  const s = S.session; if (!s) return;
  const names = { lobby: '大廳', question_show: '讀題中', question_open: '作答中',
                  question_result: '公布答案', final_ranking: '最終排行榜' };
  $('#ovStatus').innerHTML =
    `目前：<b>${names[s.phase] || s.phase}</b>` +
    (['question_show','question_open','question_result'].includes(s.phase)
      ? `・第 <b>${s.qindex + 1}</b> / ${s.questionCount ?? '–'} 題・已作答 <b>${s.answeredCount ?? 0}</b>` : '') +
    `・全場 <b>${s.playerCount ?? '–'}</b> 人`;
  document.querySelectorAll('#ovSeg button').forEach(b =>
    b.classList.toggle('on', b.dataset.m === (s.syncMode || 'auto')));
}
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

function watchPlayers(sessionId) {
  playersChannel = sb.channel('players-' + sessionId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'players', filter: 'session_id=eq.' + sessionId },
      () => { if (S.session?.phase === 'lobby') refreshLobby(); })
    .subscribe();
}

async function onSessionState(s) {
  if (s.subtitle) { const el = $('#stageSub'); if (el) el.textContent = s.subtitle; } // 主持人可改的大螢幕副標
  if (s.phase === 'final_ranking' && S.session?.phase !== 'final_ranking') S.finalAt = Date.now();
  if (s.phase !== 'final_ranking' && S.review.active) S.review = { active: false, idx: 0, data: null }; // 離開結算就退出回顧
  S.session = s;
  if (KEY && !$('#ctrlOverlay').classList.contains('hidden')) updateOverlay();
  if (['question_show', 'question_open', 'question_result'].includes(s.phase)) {
    if (!S.question || S.question.index !== s.qindex) {
      S.question = null; S.result = null;
      try { S.question = await rpc('get_current_question', { p_session_id: s.sessionId }); }
      catch (e) { console.warn(e.message); }
    }
  }
  if (s.phase === 'question_result' && !S.result) {
    try {
      [S.result, S.rankings] = await Promise.all([
        rpc('get_question_result', { p_session_id: s.sessionId }),
        rpc('get_rankings', { p_session_id: s.sessionId }),
      ]);
    } catch (e) { console.warn(e.message); }
  }
  if (s.phase === 'final_ranking' && !S.rankings?.final) {
    try { S.rankings = await rpc('get_rankings', { p_session_id: s.sessionId }); S.rankings.final = true; }
    catch (e) { console.warn(e.message); }
  }
  render();
}

function render() {
  const s = S.session; if (!s) return;
  $('#qtag').textContent =
    ['question_show','question_open','question_result'].includes(s.phase)
      ? `第 ${s.qindex + 1} 題 / ${s.questionCount ?? '–'}` : '';
  const key = [s.phase, s.qindex, !!S.question, !!S.result, !!S.rankings].join('|');
  const changed = key !== S.renderedKey;
  S.renderedKey = key;
  if (changed) { clearInterval(uiTimer); clearInterval(lobbyTimer); renderTopCtrl(); }

  if (s.phase === 'lobby') { if (changed) renderLobbyShell(); return; }
  if (!changed) { if (s.phase === 'question_open') updateAnswered(); return; }
  if (s.phase === 'question_show') renderShow();
  else if (s.phase === 'question_open') renderOpen();
  else if (s.phase === 'question_result') renderResult();
  else if (s.phase === 'final_ranking') { S.review.active ? renderReview() : renderFinal(); }
  scheduleFit();
}

// ── 大廳 ────────────────────────────────────────────────────
function renderLobbyShell() {
  body.innerHTML = `<div class="lobby">
    <div class="lobby-left">
      <div class="qr" id="qrBox"></div>
      <div class="shorturl">掃不到？直接開 ${esc(shortJoinUrl())}</div>
      ${KEY ? `<div class="start-cta">
        <button class="btn-gold pulse" id="btnStartScreen">開始遊戲</button>
        <span class="keyhint">或按 Enter 開始</span>
      </div>` : ''}
    </div>
    <div class="lobby-right">
      <div class="lobby-title">績效考核</div>
      <div class="lobbystats">
        <div class="bignum" id="lbTotal">0<small>人已加入</small></div>
        <div class="readynum" id="lbReady">0<small>/ ${TABLE_IDS.length} 桌到齊</small></div>
      </div>
      <div class="ticker" id="lbTicker"></div>
      <div class="tgrid" id="lbGrid"></div>
    </div></div>`;
  drawQR();
  $('#btnStartScreen')?.addEventListener('click', () => advance());
  refreshLobby();
  lobbyTimer = setInterval(refreshLobby, 2000); // 輪詢保底，Realtime insert 另外即時觸發
}
function drawQR() {
  const qr = qrcode(0, 'L');   // 投影畫面乾淨，用最低容錯換取最大格點
  qr.addData(joinUrl);
  qr.make();
  $('#qrBox').innerHTML = qr.createImgTag(8, 4);   // margin=4：QR 規格要求的留白，少了會掃不到
}
async function refreshLobby() {
  try { S.lobby = await rpc('get_lobby_state', { p_session_id: S.session.sessionId }); }
  catch (e) { return; }
  const lb = S.lobby, byTable = {};
  (lb.tables || []).forEach(t => byTable[t.table] = t);
  const ready = TABLE_IDS.filter(t => (byTable[t]?.count || 0) >= lb.threshold).length;
  if (!$('#lbGrid')) return;
  $('#lbTotal').innerHTML = `${lb.total}<small>人已加入</small>`;
  $('#lbReady').innerHTML = `${ready}<small>/ ${TABLE_IDS.length} 桌到齊</small>`;
  $('#lbGrid').innerHTML = TABLE_IDS.map(t => {
    const n = byTable[t]?.count || 0, ok = n >= lb.threshold;
    return `<div class="tchip${ok ? ' ready' : ''}"><b>${t}</b><span>${ok ? '✓ ' : ''}${n} 人</span></div>`;
  }).join('');
  if (lb.latest) {
    const tag = lb.latest.name + '|' + lb.latest.table;
    if (tag !== S.lastJoin) {
      S.lastJoin = tag;
      $('#lbTicker').innerHTML = `<span>🎉 ${esc(lb.latest.name)}（${esc(lb.latest.table)} 桌）加入了！</span>`;
    }
  }
}

// ── 讀題 / 作答 ─────────────────────────────────────────────
function renderShow() {
  body.innerHTML = `<div class="qshow"><h2>${S.question ? esc(S.question.text) : '⋯'}</h2></div>`;
}
function renderOpen() {
  const q = S.question, s = S.session;
  if (!q) { body.innerHTML = `<div class="qshow"><h2>⋯</h2></div>`; return; }
  const total = (q.time_limit_seconds || 10) * 1000;
  body.innerHTML = `<div class="qopen">
    <div class="qtop">
      <div class="qtext">${esc(q.text)}</div>
      <div class="countrow">
        <div class="timerbig" id="stTimer">${q.time_limit_seconds}</div>
        <div class="track"><div class="fill" id="stFill" style="width:100%"></div></div>
        <div class="answered"><b id="stAns">${s.answeredCount ?? 0}</b> / <span id="stTotal">${s.playerCount ?? '–'}</span> 已作答</div>
      </div>
    </div>
    <div class="opts">${q.options.map((o, i) =>
      `<div class="opt ${LETTERS[i]}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></div>`).join('')}
    </div></div>`;
  uiTimer = setInterval(() => {
    const left = Math.max(0, (s.deadline || 0) - clock.now());
    const sec = Math.ceil(left / 1000);
    const tm = $('#stTimer'), f = $('#stFill');
    if (tm) { tm.textContent = sec; tm.classList.toggle('hot', sec <= 5); }
    if (f) f.style.width = (left / total * 100) + '%';
  }, 100);
}
function updateAnswered() {
  const s = S.session;
  const a = $('#stAns'), t = $('#stTotal');
  if (a && s.answeredCount != null) a.textContent = s.answeredCount;
  if (t && s.playerCount != null) t.textContent = s.playerCount;
}

// ── 公布答案 ────────────────────────────────────────────────
function renderResult() {
  const q = S.question, r = S.result, s = S.session;
  if (!q || !r) { body.innerHTML = `<div class="qshow"><h2>統計中⋯</h2></div>`; return; }
  const counts = r.counts || [0, 0, 0, 0];
  const max = Math.max(1, ...counts);
  const top = (S.rankings?.individuals || []).slice(0, 5);
  const isLast = s.qindex + 1 >= (s.questionCount || 0);
  body.innerHTML = `<div class="resultgrid">
    <div class="left">
      <div class="qtext">${esc(q.text)}</div>
      <div class="opts">${q.options.map((o, i) => {
        const win = i === r.correct_index;
        return `<div class="opt ${LETTERS[i]} ${win ? 'win' : 'dim'}">
          <span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span>
          ${win ? `<span class="tick">✔</span>` : ''}
          <span class="bar"><i style="width:${Math.round(counts[i] / max * 90)}px"></i><em>${counts[i]}</em></span></div>`;
      }).join('')}</div>
    </div>
    <div class="top5"><h3>個人榜 TOP 5</h3><ol>${top.map((p, i) =>
      `<li><span class="rk">${i + 1}</span>${esc(p.name)}<span class="pts">${p.correct} 題・${secs(p.total_ms)}s</span></li>`).join('')}
    </ol></div></div>
    <div class="nextin">
      <div class="track"><div class="fill" id="resFill" style="width:100%"></div></div>
      <span>${isLast ? `<b id="nextIn">7</b> 秒後公布最終排名 🏆` : `<b id="nextIn">7</b> 秒後進入下一題`}</span></div>`;
  const total = 7000;
  uiTimer = setInterval(() => {
    const left = Math.max(0, (s.phaseUntil || 0) - clock.now());
    const el = $('#nextIn'), f = $('#resFill');
    if (el) el.textContent = Math.ceil(left / 1000);
    if (f) f.style.width = Math.min(100, left / total * 100) + '%';
  }, 100);
}

// ── 最終雙排行榜 ────────────────────────────────────────────
function renderFinal() {
  const ind = (S.rankings?.individuals || []).slice(0, 6);
  const tbs = (S.rankings?.tables || []).slice(0, 6);
  body.innerHTML = `<div class="finalsplit">
    <div class="fcol">
      <div class="final-title">🏆 個人績效 MVP</div>
      <div class="rankhead"><span class="rh-spacer"></span><span class="rh-fill"></span>
        <span class="col">答對題數</span><span class="col">使用秒數</span></div>
      <div class="ranklist">${ind.map((p, i) => `
        <div class="row${i === 0 ? ' first' : ''}" style="animation-delay:${(i * .12).toFixed(2)}s">
          <span class="rk">${i + 1}</span><span class="who">${esc(p.name)}<small>${esc(p.table)} 桌</small></span>
          <span class="col">${p.correct} 題</span><span class="col">${secs(p.total_ms)}s</span></div>`).join('')}</div>
    </div>
    <div class="fdivider"></div>
    <div class="fcol">
      <div class="final-title">🍻 團體績效 MVP</div>
      <div class="rankhead"><span class="rh-spacer"></span><span class="rh-fill"></span>
        <span class="col">平均答對題數</span><span class="col">平均秒數</span></div>
      <div class="ranklist">${tbs.map((t, i) => `
        <div class="row${i === 0 ? ' first' : ''}" style="animation-delay:${(i * .12).toFixed(2)}s">
          <span class="rk">${i + 1}</span><span class="who">${esc(t.table)} 桌<small>${t.members} 人</small></span>
          <span class="col">${t.avg_correct} 題</span><span class="col">${secs(t.avg_ms)}s</span></div>`).join('')}</div>
    </div></div>
    ${KEY ? `<div class="review-cta"><button class="btn-gold" id="btnReview">🔍 回顧本次作答結果</button></div>` : ''}`;
  $('#btnReview')?.addEventListener('click', enterReview);
}

// ── 回顧模式：逐題檢視正解、分布、最速答對 ──────────────────
async function enterReview() {
  try {
    const data = await rpc('get_review', { p_session_id: S.session.sessionId });
    if (!data || !data.length) { alert('目前沒有可回顧的作答資料'); return; }
    S.review = { active: true, idx: 0, data };
    renderReview();
  } catch (e) {
    alert('無法載入回顧資料：' + e.message + '\n（若剛新增功能，請先在 Supabase 執行 get_review 那段 SQL）');
  }
}
function exitReview() { S.review.active = false; renderFinal(); }
function reviewNav(d) {
  const n = S.review.data.length;
  const i = Math.max(0, Math.min(n - 1, S.review.idx + d));
  if (i !== S.review.idx) { S.review.idx = i; renderReview(); }
}
function renderReview() {
  const d = S.review.data, i = S.review.idx, q = d[i];
  const counts = q.counts || [0, 0, 0, 0];
  const max = Math.max(1, ...counts);
  const top = q.top || [];
  body.innerHTML = `
    <div class="review-head">🔍 回顧・第 ${q.index + 1} 題（共 ${d.length} 題）</div>
    <div class="resultgrid">
      <div class="left">
        <div class="qtext">${esc(q.text)}</div>
        <div class="opts">${q.options.map((o, k) => {
          const win = k === q.correct_index;
          return `<div class="opt ${LETTERS[k]} ${win ? 'win' : 'dim'}">
            <span class="shape">${SHAPES[k]}</span><span>${esc(o)}</span>
            ${win ? `<span class="tick">✔</span>` : ''}
            <span class="bar"><i style="width:${Math.round(counts[k] / max * 90)}px"></i><em>${counts[k]}</em></span></div>`;
        }).join('')}</div>
      </div>
      <div class="top5"><h3>排行榜　<span style="color:var(--muted);font-weight:700;letter-spacing:0">${q.correct_count}/${q.answered} 人答對</span></h3>
        <ol>${top.length ? top.map((p, k) =>
          `<li><span class="rk">${k + 1}</span>${esc(p.name)}<span class="pts">${esc(p.table)} 桌・${secs(p.elapsed_ms)}s</span></li>`).join('')
          : `<li style="border:none; color:var(--muted)">本題無人答對 😲</li>`}</ol></div>
    </div>
    <div class="review-nav">
      <button class="btn-ghost" id="rvPrev" ${i === 0 ? 'disabled' : ''}>← 上一題</button>
      <span class="rv-idx">${i + 1} / ${d.length}</span>
      <button class="btn-ghost" id="rvNext" ${i === d.length - 1 ? 'disabled' : ''}>下一題 →</button>
      <button class="btn-gold" id="rvBack">回到總排行榜</button>
    </div>`;
  scheduleFit();
  $('#rvPrev').onclick = () => reviewNav(-1);
  $('#rvNext').onclick = () => reviewNav(1);
  $('#rvBack').onclick = exitReview;
}

boot();
</script>
</body>
</html>
