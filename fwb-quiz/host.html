<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>績效考核・主持人｜支薪好友《向上管理》</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="shared.css?v=20260815d">
</head>
<body>
<div class="host">
  <div class="host-head">
    <h1><img class="logo-img" src="logo.jpg" alt="FWB.manzai" style="margin-right:8px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'FWB.manzai'}))">支薪好友現場問答系統．主持人控制台</h1>
    <a class="btn-ghost" id="lnkScreen" target="_blank" style="margin-left:auto; text-decoration:none; white-space:nowrap">🖥 開啟大螢幕 ↗</a>
  </div>
  <p class="subtitle">此頁是整場的節奏驅動者——遊戲進行中請全程保持開啟、螢幕不要鎖定。</p>
  <div id="body"><div class="hpanel"><h2>連線中⋯</h2></div></div>
</div>
<div class="conn-dot" id="connDot"></div>

<script type="module">
import { CONFIG, rpc, clock, createSync, normalizeState,
         TABLE_IDS, LETTERS, $, esc } from './shared.js?v=20260815d';

const KEY = new URLSearchParams(location.search).get('key') || '';
const body = $('#body');
// 右上角：一鍵開大螢幕（帶控制金鑰）
$('#lnkScreen').href = 'screen.html?code=' + encodeURIComponent(CONFIG.joinCode) + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
const S = {
  session: null, lobby: null, questions: null,
  advancing: false, renderedKey: '', editorOpen: false, editorDraft: null,
};
let sync = null, lobbyTimer = null, tickTimer = null, wakeLock = null;

const PHASE_NAME = {
  lobby: '大廳開放中', question_show: '讀題中', question_open: '作答中',
  question_result: '公布答案', final_ranking: '最終排行榜（遊戲結束）',
};

async function boot() {
  if (!KEY) { body.innerHTML = `<div class="hpanel"><h2>缺少金鑰</h2><p style="font-size:13px">網址需帶 ?key=主持人金鑰</p></div>`; return; }
  try {
    await clock.sync();
    // 用讀題目這支驗證金鑰（金鑰錯會直接丟錯誤）
    S.questions = await rpc('host_get_questions', { p_code: CONFIG.joinCode, p_secret: KEY });
    const s = normalizeState(await rpc('get_session_by_code', { p_code: CONFIG.joinCode }));
    sync = createSync({
      sessionId: s.sessionId,
      onState: st => { S.session = st; render(); },
      onConn: c => {
        const el = $('#connDot');
        el.textContent = c.realtime ? '● realtime' : '● polling';
        el.classList.toggle('degraded', c.degraded);
      },
    });
    S.session = s;
    render();
    sync.start();
    startConductor();
    keepAwake();
    initHostKeys();
    lobbyTimer = setInterval(refreshLobby, 2000);
    refreshLobby();
  } catch (e) {
    body.innerHTML = `<div class="hpanel"><h2 style="color:var(--bad)">無法進入控制台</h2>
      <p style="font-size:13px;margin-top:8px">${esc(e.message)}</p></div>`;
  }
}

// 快捷鍵：Enter = 開始遊戲（大廳）／緊急略過（遊戲中）。在輸入框或按鈕上不觸發。
function initHostKeys() {
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target instanceof Element && e.target.matches('input,textarea,select,button,a')) return;
    const s = S.session; if (!s) return;
    if (s.phase === 'lobby' || ['question_show','question_open','question_result'].includes(s.phase)) advance();
  });
}

// 螢幕保持喚醒（支援的裝置上防止手機鎖屏中斷流程）
async function keepAwake() {
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
    document.addEventListener('visibilitychange', async () => {
      if (!document.hidden && wakeLock?.released) wakeLock = await navigator.wakeLock?.request('screen');
    });
  } catch (e) { /* 不支援就算了 */ }
}

// ── 節奏驅動者：時間到就呼叫 host_advance 推進全場 ───────────
function startConductor() {
  tickTimer = setInterval(async () => {
    const s = S.session;
    if (!s || S.advancing) return;
    let target = null;
    if (s.phase === 'question_show' || s.phase === 'question_result') target = s.phaseUntil;
    if (s.phase === 'question_open') target = s.deadline;
    if (target && clock.now() >= target + 80) await advance(); // +80ms 緩衝
    updateCountdown();
  }, 200);
}
async function advance() {
  if (S.advancing) return;
  S.advancing = true;
  try {
    let st;
    try {
      // 聲明目前所在階段，若已被大螢幕（控制模式）推進過則伺服器不重複動作
      st = await rpc('host_advance', { p_code: CONFIG.joinCode, p_secret: KEY,
        p_from_phase: S.session.phase, p_from_qindex: S.session.qindex });
    } catch (e) {
      if (/host_advance/.test(e.message)) st = await rpc('host_advance', { p_code: CONFIG.joinCode, p_secret: KEY });
      else throw e;
    }
    S.session = normalizeState(st); render();
  } catch (e) { console.warn('advance 失敗', e.message); }
  finally { S.advancing = false; }
}

async function refreshLobby() {
  if (!S.session) return;
  try { S.lobby = await rpc('get_lobby_state', { p_session_id: S.session.sessionId }); renderLobbyBits(); }
  catch (e) { /* 下次再試 */ }
}

// ── 畫面 ────────────────────────────────────────────────────
function render() {
  const s = S.session; if (!s) return;
  const key = [s.phase, s.qindex, S.editorOpen].join('|');
  if (key === S.renderedKey) { updateCountdown(); renderLobbyBits(); return; }
  S.renderedKey = key;

  const inLobby = s.phase === 'lobby';
  const running = ['question_show','question_open','question_result'].includes(s.phase);
  const qText = running ? (S.questions?.[s.qindex]?.text || '') : '';
  body.innerHTML = `
    <div class="hpanel">
      <h2><i>1</i>遊戲狀態</h2>
      <div class="hphase">${
        inLobby ? `🟡 <b>等待中</b>——觀眾陸續掃碼加入，人到齊按「開始遊戲」`
        : running ? `🟢 <b>進行中</b>・第 <b>${s.qindex + 1}</b> / ${s.questionCount ?? '–'} 題・${PHASE_NAME[s.phase]}<span id="hCountdown" style="color:var(--gold)"></span>（自動推進，不需操作）`
        : `🏁 <b>遊戲結束</b>——大螢幕正在顯示最終排行榜`}</div>
      ${running ? `<div class="hq">「${esc(qText)}」</div>` : ''}
      <div class="hrow">
        ${inLobby ? `<button class="btn-gold pulse" id="btnStart">開始遊戲（Enter）</button>` : ''}
        ${running ? `<button class="btn-ghost" id="btnSkip">緊急略過本階段 ▸（Enter）</button>` : ''}
        <button class="btn-ghost" id="btnReset">重置整場（清空玩家）</button>
      </div>
      <div class="hsub">
        <label>大螢幕左上角文字</label>
        <div class="hsub-row">
          <input id="subInput" maxlength="40" value="${esc(s.subtitle || '支薪好友專場互動之《績效考核》')}">
          <button class="btn-ghost" id="subSave">更新</button>
          <span class="savebar msg" id="subMsg"></span>
        </div>
      </div>
    </div>

    <div class="hpanel">
      <h2><i>2</i>觀眾狀態</h2>
      <div class="hcards">
        <div class="hcard"><b id="hTotal">–</b><span>人已加入</span></div>
        <div class="hcard"><b id="hReady">–</b><span>桌已到齊</span></div>
        ${running ? `<div class="hcard"><b id="hAns">–</b><span>本題已作答</span></div>` : ''}
      </div>
    </div>

    <div class="hpanel">
      <h2><i>3</i>大廳監控<span class="h2note">滑鼠移到桌上可看成員名單</span></h2>
      <div class="htables" id="hTables"></div>
    </div>

    <div class="hpanel">
      <h2><i>4</i>題目設定 <button class="btn-ghost" id="btnEditor">${S.editorOpen ? '收合' : '展開編輯'}</button></h2>
      <div id="editorBox">${S.editorOpen ? '' : `<p class="hnote">目前 ${S.questions?.length ?? '–'} 題。可改文字、選項、正解、每題秒數；拖曳 ⠿ 或按 ↑↓ 調整順序。限大廳階段儲存。</p>`}</div>
    </div>

    <div class="hpanel">
      <h2><i>5</i>同步模式<span class="h2note">技術保險，平常不用動</span></h2>
      <div class="hrow" style="margin-top:0">
        <div class="seg" id="segSync">
          <button data-m="auto">自動（建議）</button>
          <button data-m="force_realtime">強制即時推播</button>
          <button data-m="force_polling">強制輪詢</button>
        </div>
      </div>
      <p class="hnote" style="margin-top:12px">
        觀眾手機更新畫面有兩條路：<b>即時推播</b>（最快，但我們用的免費方案全場同時連線上限約 200，人多或現場網路差時可能斷線）、
        <b>輪詢</b>（手機每 1.5 秒主動查一次，慢半拍但最穩）。<br>
        平常放「<b>自動</b>」就好——預設走即時推播，哪支手機連不上會自己改用輪詢，完全不用管。
        只有當<b>很多觀眾同時反映畫面卡住不動</b>時，才按「<b>強制輪詢</b>」讓全場改走穩定路線（約 5 秒內生效）。
        「強制即時推播」只有測試時才用得到。
      </p>
    </div>`;

  $('#btnStart')?.addEventListener('click', () => advance());
  $('#btnSkip')?.addEventListener('click', () => advance());
  $('#btnReset')?.addEventListener('click', async () => {
    if (!confirm('確定重置？會清空所有玩家與作答紀錄，回到大廳。')) return;
    try {
      const st = normalizeState(await rpc('host_reset', { p_code: CONFIG.joinCode, p_secret: KEY }));
      S.session = st; S.renderedKey = ''; render(); refreshLobby();
    } catch (e) { alert('重置失敗：' + e.message); }
  });
  $('#subSave')?.addEventListener('click', async () => {
    const msg = $('#subMsg');
    try {
      const st = normalizeState(await rpc('host_set_subtitle',
        { p_code: CONFIG.joinCode, p_secret: KEY, p_text: $('#subInput').value }));
      S.session.subtitle = st.subtitle;
      msg.textContent = '✓ 已更新，大螢幕即時生效';
      msg.classList.remove('err');
    } catch (e) {
      msg.textContent = /host_set_subtitle/.test(e.message)
        ? '請先在 Supabase 執行 host_set_subtitle 那段 SQL' : ('更新失敗：' + e.message);
      msg.classList.add('err');
    }
  });
  $('#segSync').querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
    try {
      const st = normalizeState(await rpc('host_set_sync_mode', { p_code: CONFIG.joinCode, p_secret: KEY, p_mode: b.dataset.m }));
      S.session = st; markSyncSeg();
    } catch (e) { alert(e.message); }
  }));
  $('#btnEditor').addEventListener('click', async () => {
    S.editorOpen = !S.editorOpen;
    if (S.editorOpen) {
      S.questions = await rpc('host_get_questions', { p_code: CONFIG.joinCode, p_secret: KEY });
      S.editorDraft = JSON.parse(JSON.stringify(S.questions));
    }
    S.renderedKey = ''; render();
  });
  markSyncSeg();
  renderLobbyBits();
  if (S.editorOpen) renderEditor();
  updateCountdown();
}

function markSyncSeg() {
  const m = S.session?.syncMode || 'auto';
  document.querySelectorAll('#segSync button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
}

function updateCountdown() {
  const s = S.session, el = $('#hCountdown');
  if (!el || !s) return;
  let target = null;
  if (s.phase === 'question_show' || s.phase === 'question_result') target = s.phaseUntil;
  if (s.phase === 'question_open') target = s.deadline;
  el.textContent = target ? `・剩 ${Math.max(0, Math.ceil((target - clock.now()) / 1000))} 秒` : '';
  const a = $('#hAns');
  if (a && s.answeredCount != null) a.textContent = s.answeredCount;
}

function renderLobbyBits() {
  const lb = S.lobby;
  if (!lb || !$('#hTables')) return;
  const byTable = {};
  (lb.tables || []).forEach(t => byTable[t.table] = t);
  const ready = TABLE_IDS.filter(t => (byTable[t]?.count || 0) >= lb.threshold).length;
  $('#hTotal').textContent = lb.total;
  $('#hReady').textContent = ready + ' / ' + TABLE_IDS.length;
  $('#hTables').innerHTML = TABLE_IDS.map(t => {
    const n = byTable[t]?.count || 0, ok = n >= lb.threshold;
    return `<div class="tchip${ok ? ' ready' : ''}" title="${esc((byTable[t]?.names || []).join('、'))}">
      <b>${t}</b><span>${n} 人</span></div>`;
  }).join('');
}

// ── 題目編輯器 ──────────────────────────────────────────────
function renderEditor() {
  const box = $('#editorBox');
  const lock = S.session.phase !== 'lobby' && S.session.phase !== 'final_ranking';
  const qs = S.editorDraft;
  box.innerHTML = (lock ? `<p style="font-size:13px;color:var(--bad);margin-bottom:10px">遊戲進行中無法儲存變更，請先重置或等結束。</p>` : '') +
    qs.map((q, qi) => `
    <div class="qe-row" data-row="${qi}">
      <div class="qe-head"><span class="qe-drag" title="按住拖曳調整順序">⠿</span><b>第 ${qi + 1} 題</b>
        <label>作答秒數 <input type="number" min="5" max="60" value="${q.time_limit_seconds}" data-qi="${qi}" data-k="time"></label>
        <button class="qe-move" data-up="${qi}" ${qi === 0 ? 'disabled' : ''} title="往上移">↑</button>
        <button class="qe-move" data-down="${qi}" ${qi === qs.length - 1 ? 'disabled' : ''} title="往下移">↓</button>
        <button class="qe-del" data-del="${qi}">移除</button></div>
      <input type="text" class="qe-text" value="${esc(q.text)}" data-qi="${qi}" data-k="text" placeholder="題目文字">
      <div class="qe-opts">${q.options.map((o, oi) => `
        <label class="qe-opt"><input type="radio" name="qc${qi}" ${q.correct_index === oi ? 'checked' : ''} data-qi="${qi}" data-correct="${oi}" title="設為正確答案">
          <input type="text" value="${esc(o)}" data-qi="${qi}" data-oi="${oi}" placeholder="選項 ${LETTERS[oi]}"></label>`).join('')}</div>
    </div>`).join('') + `
    <div class="savebar">
      <button class="btn-ghost" id="qeAdd">＋ 新增題目</button>
      <button class="btn-gold" id="qeSave" ${lock ? 'disabled' : ''}>儲存全部題目</button>
      <span class="msg" id="qeMsg"></span>
    </div>`;

  // 拖曳排序：從 ⠿ 把手拖起，放到目標題目上即插入該位置（觸控裝置請用 ↑↓）
  let dragIdx = null;
  box.querySelectorAll('.qe-row').forEach(row => {
    const handle = row.querySelector('.qe-drag');
    handle.addEventListener('mousedown', () => { row.draggable = true; });
    handle.addEventListener('mouseup', () => { row.draggable = false; });
    row.addEventListener('dragstart', e => {
      dragIdx = +row.dataset.row;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIdx)); } catch (_) {}
    });
    row.addEventListener('dragend', () => {
      row.draggable = false; row.classList.remove('dragging'); dragIdx = null;
      box.querySelectorAll('.qe-row').forEach(r => r.classList.remove('dropover'));
    });
    row.addEventListener('dragover', e => {
      if (dragIdx === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if (+row.dataset.row !== dragIdx) row.classList.add('dropover');
    });
    row.addEventListener('dragleave', () => row.classList.remove('dropover'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      const to = +row.dataset.row;
      if (dragIdx === null || to === dragIdx) return;
      const [moved] = qs.splice(dragIdx, 1);
      qs.splice(to, 0, moved);
      dragIdx = null;
      renderEditor();
    });
  });

  box.oninput = e => {
    const t = e.target, qi = +t.dataset.qi;
    if (Number.isNaN(qi)) return;
    if (t.dataset.k === 'time') qs[qi].time_limit_seconds = Math.max(5, Math.min(60, +t.value || 10));
    else if (t.dataset.k === 'text') qs[qi].text = t.value;
    else if (t.dataset.oi !== undefined) qs[qi].options[+t.dataset.oi] = t.value;
  };
  box.onchange = e => {
    const t = e.target;
    if (t.dataset.correct !== undefined) qs[+t.dataset.qi].correct_index = +t.dataset.correct;
  };
  box.onclick = async e => {
    if (e.target.id === 'qeAdd') {
      qs.push({ text: '新題目', options: ['選項 A','選項 B','選項 C','選項 D'], correct_index: 0, time_limit_seconds: 10 });
      renderEditor(); return;
    }
    if (e.target.dataset.up !== undefined) {
      const i = +e.target.dataset.up;
      if (i > 0) { [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; renderEditor(); }
      return;
    }
    if (e.target.dataset.down !== undefined) {
      const i = +e.target.dataset.down;
      if (i < qs.length - 1) { [qs[i], qs[i + 1]] = [qs[i + 1], qs[i]]; renderEditor(); }
      return;
    }
    if (e.target.dataset.del !== undefined) {
      if (qs.length <= 1) return;
      qs.splice(+e.target.dataset.del, 1);
      renderEditor(); return;
    }
    if (e.target.id === 'qeSave') {
      const msg = $('#qeMsg');
      try {
        const payload = qs.map(q => ({ qtext: q.text, opts: q.options, cidx: q.correct_index, tsec: q.time_limit_seconds }));
        S.questions = await rpc('host_replace_questions',
          { p_code: CONFIG.joinCode, p_secret: KEY, p_questions: payload });
        S.editorDraft = JSON.parse(JSON.stringify(S.questions));
        renderEditor(); // 重新綁定到新草稿，避免後續操作作用在舊資料上
        $('#qeMsg').textContent = '✓ 已儲存 ' + S.questions.length + ' 題';
        $('#qeMsg').classList.remove('err');
        sync.refetch(); // 更新 question_count
        return;
      } catch (err) {
        msg.textContent = '儲存失敗：' + err.message;
        msg.classList.add('err');
      }
    }
  };
}

boot();
</script>
</body>
</html>
