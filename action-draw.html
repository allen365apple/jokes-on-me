<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看我動作片｜看我笑話工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root { --face: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; --fw: 900; }
html, body { margin: 0; }
html { background: #000; scrollbar-color: #2e2e2e #000; }
::-webkit-scrollbar { width: 10px; background: #000; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
body {
  background: #000;
  color: #f9f5ea;
  font-family: var(--face);
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#top-pad { height: 45vh; flex: 0 0 auto; }
#bottom-pad { height: 100vh; flex: 0 0 auto; }

#intro {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3vw;
  min-height: 62vh;
}
#intro h1 {
  font-size: min(11vw, 17vh);
  font-weight: var(--fw);
  letter-spacing: .08em;
  margin: 0;
  white-space: nowrap;
}
.deco { display: flex; flex-direction: column; align-items: center; gap: 2.5vh; }
.deco svg { height: 17vh; display: block; }
.deco .a { transform: rotate(-8deg); }
.deco .b { transform: rotate(6deg); }
.deco .c { transform: rotate(7deg); }
.deco .d { transform: rotate(-6deg); }

#drawview {
  display: none;
  flex-direction: column;
  align-items: center;
  min-height: 62vh;
  justify-content: center;
}
/* 畫面上不放任何文字——圖本身就是要模仿的動作 */
#posebox { height: min(62vh, 84vw); display: flex; align-items: center; justify-content: center; }
#posebox svg, #posebox img { height: 100%; max-width: 94vw; object-fit: contain; display: block; }
#endview {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 62vh;
  gap: 3vh;
}
#end-big {
  font-size: min(11vh, 13vw);
  font-weight: var(--fw);
  letter-spacing: .12em;
}
#end-sub { font-size: min(2.8vh, 17px); letter-spacing: 3px; opacity: .55; }
.pop { animation: pop .28s ease; }
@keyframes pop {
  from { transform: scale(.82) rotate(-3deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);  opacity: 1; }
}

#controls { text-align: center; margin-top: 3.5vh; }
#round-info { font-size: 14px; opacity: .4; letter-spacing: 1px; margin-bottom: 10px; min-height: 17px; }
#btn-row { display: flex; gap: 12px; justify-content: center; align-items: center; }
#end {
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 2px;
  padding: 8px 18px;
  border-radius: 10px;
  border: 1.5px solid rgba(249,245,234,.25);
  background: transparent;
  color: rgba(249,245,234,.7);
  cursor: pointer;
}
#end:hover { border-color: rgba(249,245,234,.5); color: #f9f5ea; }
#end:active { transform: scale(.95); }
#go, #next {
  font-family: inherit;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 4px;
  padding: 7px 30px 8px 34px;
  border-radius: 10px;
  border: 1.5px solid rgba(249,245,234,.4);
  background: #111;
  color: #f9f5ea;
  cursor: pointer;
}
#go:hover, #next:hover { background: #1d1d1d; }
#go:active, #next:active { transform: scale(.95); }
#hint { margin-top: 9px; font-size: 13px; opacity: .4; letter-spacing: 1px; line-height: 2; }
#fs, #console-link, #list-link {
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 4px;
}
#fs:hover, #console-link:hover, #list-link:hover { color: #f9f5ea; opacity: 1; }
#home-link {
  color: inherit;
  text-decoration: underline dotted;
  text-underline-offset: 4px;
}
#home-link:hover { color: #f9f5ea; }

@media (max-width: 600px) {
  #intro { gap: 2vw; }
  .deco { gap: 1.8vh; }
  .deco svg { height: 9vh; }
  #panel { bottom: 12px; }
}

#panel {
  display: none;
  position: fixed;
  left: 50%; bottom: 56px;
  transform: translateX(-50%);
  width: 340px;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  box-sizing: border-box;
  background: #161616;
  border: 1px solid #3a3a3a;
  border-radius: 12px;
  padding: 18px 22px 16px;
  z-index: 10;
  font-size: 15px;
}
#panel-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
.psec { font-size: 13px; letter-spacing: 2px; color: rgba(249,245,234,.5); margin: 14px 0 8px; }
#font-btns { display: flex; gap: 8px; }
#font-btns button {
  flex: 1;
  font-size: 15px;
  padding: 7px 0;
  border-radius: 8px;
  border: 1px solid rgba(249,245,234,.3);
  background: #222;
  color: #f9f5ea;
  cursor: pointer;
}
#font-btns button.on { background: #f9f5ea; color: #111; border-color: #f9f5ea; }
.prow { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.gname { width: 56px; flex: 0 0 auto; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow input[type=range] { flex: 1; accent-color: #d97706; }
.gpct { width: 56px; text-align: right; flex: 0 0 auto; color: #f0c894; font-size: 14px; }
#lib-btns { display: flex; gap: 8px; flex-wrap: wrap; }
#lib-btns button {
  flex: 1 1 auto;
  min-width: 0;
  font-family: inherit;
  font-size: 14px;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid rgba(249,245,234,.3);
  background: #222;
  color: #f9f5ea;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#lib-btns button.on { background: #f9f5ea; color: #111; border-color: #f9f5ea; }
#photo-status { font-size: 12px; opacity: .5; margin-top: 10px; line-height: 1.6; }
#panel-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
#panel-btns button {
  font-family: inherit;
  font-size: 14px;
  padding: 4px 14px;
  border-radius: 8px;
  border: 1px solid rgba(249,245,234,.35);
  background: #222;
  color: #f9f5ea;
  cursor: pointer;
}
#panel-note { font-size: 12px; opacity: .45; margin-top: 10px; line-height: 1.6; }

/* ===== 動作清單（拍攝對照表） ===== */
#list {
  display: none;
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 20;
  overflow-y: auto;
  padding: 26px 20px 60px;
  box-sizing: border-box;
}
#list h2 { font-size: 22px; letter-spacing: 3px; margin: 0 0 6px; text-align: center; }
#list-note {
  max-width: 780px;
  margin: 0 auto 22px;
  font-size: 13px;
  line-height: 1.9;
  opacity: .65;
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 14px 18px;
}
#list-note code { color: #f0c894; font-size: 13px; }
#list-note b { color: #f9f5ea; }
#list-close {
  position: fixed; top: 14px; right: 16px; z-index: 21;
  font-family: inherit; font-size: 14px; padding: 6px 16px;
  border-radius: 8px; border: 1px solid rgba(249,245,234,.35);
  background: #222; color: #f9f5ea; cursor: pointer;
}
.lgroup {
  max-width: 1100px;
  margin: 0 auto 6px;
  font-size: 15px;
  letter-spacing: 2px;
  color: rgba(249,245,234,.55);
  padding: 18px 2px 6px;
  border-bottom: 1px solid #242424;
}
.lgrid {
  max-width: 1100px;
  margin: 12px auto 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.lcard {
  background: #141414;
  border: 1px solid #262626;
  border-radius: 10px;
  padding: 10px 8px 12px;
  text-align: center;
}
.lcard svg, .lcard img { height: 120px; width: 100%; object-fit: contain; display: block; }
.lname { font-size: 14px; font-weight: 700; margin-top: 8px; }
.lsrc { font-size: 11px; opacity: .4; margin-top: 3px; letter-spacing: 1px; }
.lcard.photo { border-color: #7a5416; }
</style>
</head>
<body>
<div id="top-pad"></div>

<div id="intro">
  <div class="deco" id="deco-left"></div>
  <h1>看我動作片</h1>
  <div class="deco" id="deco-right"></div>
</div>

<div id="drawview">
  <div id="posebox"></div>
</div>

<div id="endview">
  <div id="end-big">回合結束</div>
  <div id="end-sub">按空白鍵開始下一回合</div>
</div>

<div id="controls">
  <div id="round-info"></div>
  <div id="btn-row">
    <button id="go">抽動作</button>
    <button id="end">結束這回合</button>
    <button id="next" style="display:none">開始下一回合</button>
  </div>
  <div id="hint">空白鍵抽動作 ・ Enter 結束回合<span id="fs-wrap"> ・ <span id="fs">點我進入全螢幕</span>（F 鍵）</span> ・ <span id="list-link">動作清單</span> ・ <span id="console-link">控制台</span> ・ <a href="index.html" id="home-link">看我笑話工具箱</a></div>
</div>

<div id="bottom-pad"></div>

<div id="panel">
  <div id="panel-title">控制台</div>
  <div class="psec">字體</div>
  <div id="font-btns">
    <button data-f="hei" style="font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:900">粗黑體</button>
    <button data-f="kai" style="font-family:'LXGW WenKai TC','Kaiti TC','BiauKai',serif">楷書</button>
    <button data-f="ming" style="font-family:'Noto Serif TC','Songti TC',serif">明體</button>
  </div>
  <div class="psec">目前回合（圖庫）</div>
  <div id="lib-btns"></div>
  <div class="psec">出現比例</div>
  <div id="panel-rows"></div>
  <div id="photo-status"></div>
  <div class="psec">一回合幾張</div>
  <div class="prow"><span class="gname">張數</span><input type="range" id="round-len" min="1" max="60" step="1"><span class="gpct" id="round-len-val"></span></div>
  <div id="panel-btns">
    <button id="panel-reset">恢復預設比例</button>
    <button id="panel-close">關閉</button>
  </div>
  <div id="panel-note">同一回合裡每張圖最多出現一次，全部出現過才會重新洗牌（圖比回合張數少時才會遇到）。百分比是該類動作被抽到的比重，調高的類別會更早出現。「張數」是抽滿幾張後下一按就結束回合。所有設定都會自動記住。面板開啟時空白鍵與 Enter 暫停作用。</div>
</div>

<div id="list">
  <button id="list-close">關閉</button>
  <h2>動作清單</h2>
  <div id="list-note"></div>
  <div id="list-body"></div>
</div>

<script>
/* =========================================================================
   看我動作片 — 即興劇肢體動作抽籤機

   動作來源有兩種，會同時放進抽籤池：
   (1) 真人照片 —— 放在 action-poses/ 資料夾，檔名自己帶類別（例：正經一.jpg）
   (2) 內建火柴人 —— 純程式畫的，照片還沒到齊之前的替身

   類別完全由「檔名」決定，程式裡沒有寫死任何類別名稱。
   想把「正經」改叫「認真」，就把檔名改成「認真一.jpg」，控制台的滑桿會自己變。
   ========================================================================= */

/* ===== 設定的記憶（無痕模式等讀不到 localStorage 時自動跳過，不影響演出） ===== */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* 各類別出現權重（控制台可調，會記住）。類別是動態的，所以這裡只存使用者調過的值 */
let W = {};
try { Object.assign(W, JSON.parse(store.get('dongzuo-weights') || '{}')); } catch (e) {}
const weightOf = p => (W[p.cat] === undefined ? 1 : W[p.cat]);

/* 一回合幾張（預設 30） */
const DEFAULT_ROUND_LEN = 30;
let roundLen = parseInt(store.get('dongzuo-round-len'), 10);
if (!(roundLen >= 1 && roundLen <= 60)) roundLen = DEFAULT_ROUND_LEN;

let drawsThisRound = 0;
let roundEnded = false;

/* ===== 字體設定（控制台可切換，預設粗黑體） ===== */
const FONTS = {
  hei:  { stack: 'Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif', weight: 900 },
  kai:  { stack: 'LXGW WenKai TC, Kaiti TC, BiauKai, DFKai-SB, KaiTi, serif', weight: 700 },
  ming: { stack: 'Noto Serif TC, Songti TC, PMingLiU, serif', weight: 900 }
};
let fontKey = store.get('dongzuo-font') || 'hei';
if (!FONTS[fontKey]) fontKey = 'hei';

/* =========================================================================
   火柴人繪圖
   角度：0=向下、90=向右、180=向上、-90=向左。
   arms / legs 都是 [左邊, 右邊]，每個是 [大臂(大腿)角度, 小臂(小腿)角度]。
   一個動作可以有一個或兩個人（figs）。
   ========================================================================= */
const IV = '#f9f5ea';
const TORSO = 62, SHO = 50, HEADD = 22, HEADR = 20;
const UA = 38, FA = 36, TH = 46, SHIN = 46;

const D = a => [Math.sin(a * Math.PI / 180), Math.cos(a * Math.PI / 180)];
const seg = (p, a, l) => { const d = D(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
const n2 = v => Math.round(v * 10) / 10;

/* 左右鏡射一個人（雙人對稱動作用這個生出另一半） */
function mirror(f, cx) {
  const neg = ab => [-ab[0], -ab[1]];
  const out = {
    hip: [2 * cx - f.hip[0], f.hip[1]],
    torso: -(f.torso === undefined ? 180 : f.torso),
    head: -(f.head || 0),
    arms: [neg(f.arms ? f.arms[1] : [4, 4]), neg(f.arms ? f.arms[0] : [-4, -4])],
    legs: [neg(f.legs ? f.legs[1] : [3, 3]), neg(f.legs ? f.legs[0] : [-3, -3])]
  };
  if (f.ground !== undefined) out.ground = f.ground;
  return out;
}

const PAD = 18;

function figureSVG(p) {
  const figs = p.figs || [p];
  const parts = [];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const mark = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  let groundY;

  figs.forEach(f => {
    const hip = f.hip || [120, 170];
    const t = f.torso === undefined ? 180 : f.torso;
    const neck = seg(hip, t, TORSO);
    const sho = seg(hip, t, SHO);
    const headC = seg(neck, t + (f.head || 0), HEADD);
    const bones = [];
    const hands = [];
    (f.arms || [[-9, -9], [9, 9]]).forEach(([u, fa]) => {
      const e = seg(sho, u, UA), h = seg(e, fa, FA);
      bones.push([sho, e], [e, h]);
      hands.push(h);
    });
    (f.legs || [[-6, -6], [6, 6]]).forEach(([u, sh]) => {
      const k = seg(hip, u, TH), a2 = seg(k, sh, SHIN);
      bones.push([hip, k], [k, a2]);
    });
    parts.push({ hip, neck, headC, bones, hands });
    mark(hip[0], hip[1]);
    bones.forEach(([a, b]) => { mark(a[0], a[1]); mark(b[0], b[1]); });
    mark(headC[0] - HEADR, headC[1] - HEADR);
    mark(headC[0] + HEADR, headC[1] + HEADR);
    if (f.ground !== undefined) { groundY = f.ground; mark(hip[0], f.ground); }
  });

  /* 手勢小圖示（比 V、讚、愛心…）也要算進畫面範圍 */
  const icons = p.icons || (p.icon ? [p.icon] : []);
  const handAt = ref => parts[ref[0]].hands[ref[1]];
  icons.forEach(ic => {
    (ic.hands || [[0, ic.side || 0]]).forEach(ref => {
      const h = handAt(ref);
      mark(h[0] - 24, h[1] - 28); mark(h[0] + 24, h[1] + 14);
    });
  });

  x0 -= PAD; y0 -= PAD; x1 += PAD; y1 += PAD;
  let vw = x1 - x0, vh = y1 - y0;
  /* 裁切到人物實際範圍，再補成固定比例 —— 每個動作投影出來大小才會一致 */
  const aspect = figs.length > 1 ? 1.3 : 0.8;
  if (vw / vh < aspect) { const nw = vh * aspect; x0 -= (nw - vw) / 2; vw = nw; }
  else { const nh = vw / aspect; y0 -= (nh - vh) / 2; vh = nh; }

  let g = '';
  if (groundY !== undefined) {
    g += `<line x1="${n2(x0 + 6)}" y1="${groundY}" x2="${n2(x0 + vw - 6)}" y2="${groundY}" stroke="${IV}" stroke-width="3" opacity=".22"/>`;
  }
  parts.forEach(pt => {
    g += `<line x1="${n2(pt.hip[0])}" y1="${n2(pt.hip[1])}" x2="${n2(pt.neck[0])}" y2="${n2(pt.neck[1])}" stroke="${IV}" stroke-width="11" stroke-linecap="round"/>`;
    pt.bones.forEach(([a, b]) => {
      g += `<line x1="${n2(a[0])}" y1="${n2(a[1])}" x2="${n2(b[0])}" y2="${n2(b[1])}" stroke="${IV}" stroke-width="9" stroke-linecap="round"/>`;
    });
    g += `<circle cx="${n2(pt.headC[0])}" cy="${n2(pt.headC[1])}" r="${HEADR}" fill="none" stroke="${IV}" stroke-width="9"/>`;
  });
  icons.forEach(ic => { g += drawIcon(ic, handAt); });

  return `<svg viewBox="${n2(x0)} ${n2(y0)} ${n2(vw)} ${n2(vh)}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* 手部小圖示：讓「比 V」「讚」「愛心」「招手」一眼看得懂 */
function drawIcon(ic, handAt) {
  const refs = ic.hands || [[0, ic.side || 0]];
  if (ic.type === 'heart') {
    const a = handAt(refs[0]), b = handAt(refs[1] || refs[0]);
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2 - 4, s = 15;
    return `<path d="M ${n2(cx)} ${n2(cy + 0.85 * s)} C ${n2(cx - 1.45 * s)} ${n2(cy - 0.2 * s)}, ${n2(cx - 0.7 * s)} ${n2(cy - 1.15 * s)}, ${n2(cx)} ${n2(cy - 0.4 * s)} C ${n2(cx + 0.7 * s)} ${n2(cy - 1.15 * s)}, ${n2(cx + 1.45 * s)} ${n2(cy - 0.2 * s)}, ${n2(cx)} ${n2(cy + 0.85 * s)} Z" fill="none" stroke="${IV}" stroke-width="6" stroke-linejoin="round"/>`;
  }
  const h = handAt(refs[0]);
  if (ic.type === 'v') {
    return `<line x1="${n2(h[0])}" y1="${n2(h[1])}" x2="${n2(h[0] - 9)}" y2="${n2(h[1] - 21)}" stroke="${IV}" stroke-width="7" stroke-linecap="round"/>` +
           `<line x1="${n2(h[0])}" y1="${n2(h[1])}" x2="${n2(h[0] + 10)}" y2="${n2(h[1] - 19)}" stroke="${IV}" stroke-width="7" stroke-linecap="round"/>`;
  }
  if (ic.type === 'spark') {
    /* 擊掌的火花 */
    let s = '';
    for (let a = 0; a < 360; a += 45) {
      const r1 = 15, r2 = 26, rad = a * Math.PI / 180;
      s += `<line x1="${n2(h[0] + r1 * Math.cos(rad))}" y1="${n2(h[1] + r1 * Math.sin(rad))}" x2="${n2(h[0] + r2 * Math.cos(rad))}" y2="${n2(h[1] + r2 * Math.sin(rad))}" stroke="${IV}" stroke-width="5" stroke-linecap="round" opacity=".7"/>`;
    }
    return s;
  }
  if (ic.type === 'wave') {
    return `<path d="M ${n2(h[0] + 12)} ${n2(h[1] - 14)} A 16 16 0 0 1 ${n2(h[0] + 12)} ${n2(h[1] + 10)}" fill="none" stroke="${IV}" stroke-width="5" stroke-linecap="round" opacity=".75"/>` +
           `<path d="M ${n2(h[0] + 22)} ${n2(h[1] - 20)} A 26 26 0 0 1 ${n2(h[0] + 22)} ${n2(h[1] + 16)}" fill="none" stroke="${IV}" stroke-width="5" stroke-linecap="round" opacity=".45"/>`;
  }
  return '';
}

/* =========================================================================

/* =========================================================================
   圖庫（一個圖庫 = 一個回合）

   來源有兩個，兩個都會用，而且是「疊加」的關係：

   (A) 網站上的圖 —— action-poses/ 底下每個子資料夾就是一個回合。
       這是「保底」，演出前用「收圖.command」收好，現場一定在，不靠網路。
   (B) Google Drive 的圖 —— 開頁時去對照一次，Drive 上有、網站上還沒有的
       就即時補進來（例如演出當天有人臨時丟新圖）。
       抓不到就靜靜略過，完全不影響演出。

   規則：回合＝資料夾（兩邊的資料夾合併，依名稱排序）。
        沒有任何資料夾、或某個回合一張圖都沒有 → 那個回合用內建火柴人頂著。
   ========================================================================= */
const LOCAL_DIR = 'action-poses/';
/* 本機的圖：只收瀏覽器一定看得懂的格式 */
const IMG_EXT = /\.(jpe?g|png|webp|gif)$/i;
/* Drive 的圖：多收 heic（iPhone 預設格式）與 jfif（其實就是 jpg），
   這兩種收圖時會自動轉成 jpg，即時讀 Drive 時則由 Drive 轉成 JPEG 給我們 */
const DRIVE_EXT = /\.(jpe?g|jfif|png|webp|gif|heic|heif)$/i;
/* Drive 圖片的顯示網址（公開分享的檔案可以直接這樣嵌） */
const driveImgURL = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';

const CN = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function cnNum(s) {
  if (!s) return 0;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  const m = s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if (m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
  return CN[s] || 0;
}

/* 把檔名拆成 類別 / 編號 / 動作名稱 */
function parseFileName(file) {
  const base = file.replace(IMG_EXT, '');
  const bits = base.split(/[\s_]+/).filter(Boolean);
  let head = bits[0] || base;
  let rest = bits.slice(1);
  let m = head.match(/^(.*?)[-]?(\d+|[一二三四五六七八九十]+)$/);
  let cat, idx;
  if (m && m[1]) { cat = m[1]; idx = cnNum(m[2]); }
  else {
    /* 類別和編號中間有空白的寫法：荒謬 02 高抬腿 */
    cat = head; idx = 0;
    if (rest.length && /^(\d+|[一二三四五六七八九十]+)$/.test(rest[0])) {
      idx = cnNum(rest[0]);
      rest = rest.slice(1);
    }
  }
  return { cat: cat.replace(/[-_]+$/, ''), idx, name: rest.join(' ') };
}

/* ===== 圖庫組裝 ===== */
let LIBS = [];          /* [{ name, poses, stick }]，一個 = 一個回合 */
let curLib = 0;
let libNote = '目前用內建火柴人。';
let driveNote = '';

function makePhoto(file, url, from) {
  const info = parseFileName(file);
  return { rawCat: info.cat, cat: info.cat, idx: info.idx, name: info.name, file, url, src: 'photo', from };
}

/* 相機、手機、截圖的自動檔名——這些不能當成「類別」，
   不然朋友丟一堆 IMG_2847.JPG 進來，控制台就會冒出一個叫「IMG」的滑桿 */
const AUTO_NAME = /^(img|dsc|dscn|pxl|mvimg|line|photo|image|pic|screenshot|scr|未命名|照片|圖片|截圖|螢幕截圖|下載)$/i;

/* 同一個前綴至少有 2 張才算一個「類別」，否則整個回合當成一類。
   這樣「正經一/正經二/…」會分類；動漫、迷因那種自由命名的就不會爆出一堆滑桿。 */
function buildCats(lib) {
  const n = {};
  lib.poses.forEach(p => { if (p.rawCat) n[p.rawCat] = (n[p.rawCat] || 0) + 1; });
  lib.poses.forEach(p => {
    p.cat = (p.rawCat && !AUTO_NAME.test(p.rawCat) && n[p.rawCat] >= 2) ? p.rawCat : lib.name;
  });
}

function assembleLibs(localGroups, driveGroups) {
  const map = new Map();
  /* 比對用的鍵去掉副檔名——Drive 上的 abc.heic 收進網站後會變成 abc.jpg，
     不去掉的話會被當成兩張不同的圖 */
  const key = f => f.replace(/\.[^.]+$/, '').toLowerCase();
  const take = (groups, from, ext) => groups.forEach(g => {
    if (!map.has(g.name)) map.set(g.name, { name: g.name, poses: [], seen: new Set() });
    const lib = map.get(g.name);
    g.files.forEach(f => {
      if (!ext.test(f.file) || f.file.startsWith('.') || lib.seen.has(key(f.file))) return;
      lib.seen.add(key(f.file));
      lib.poses.push(makePhoto(f.file, f.url, from));
    });
  });
  take(localGroups, 'local', IMG_EXT);   /* 網站上的先進來，Drive 只補沒有的 */
  take(driveGroups, 'drive', DRIVE_EXT);

  const libs = [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  libs.forEach(lib => {
    lib.poses.sort((a, b) =>
      a.cat.localeCompare(b.cat, 'zh-Hant') || a.idx - b.idx || a.file.localeCompare(b.file, 'zh-Hant'));
    if (!lib.poses.length) { lib.poses = POSES; lib.stick = true; }   /* 空的回合用火柴人頂著 */
    else buildCats(lib);
    delete lib.seen;
  });
  LIBS = libs.length ? libs : [{ name: '動作', poses: POSES, stick: true }];
  if (curLib >= LIBS.length) curLib = 0;

  const photo = LIBS.filter(l => !l.stick);
  libNote = photo.length
    ? `共 ${LIBS.length} 個回合：` + LIBS.map(l =>
        `${l.name}（${l.stick ? '火柴人' : l.poses.length + ' 張'}）`).join('、')
    : '還沒有任何照片，目前全部用內建火柴人。';
}

function loadLocal() {
  return fetch(LOCAL_DIR + '清單.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(j => (j.回合 || []).map(g => ({
      name: g.名稱,
      files: (g.檔案 || []).map(f => ({
        file: f,
        url: LOCAL_DIR + encodeURIComponent(g.名稱) + '/' + encodeURIComponent(f)
      }))
    })))
    .catch(() => []);
}

/* Drive 讀不到就回空陣列——現場沒網路照樣能演 */
function loadDrive() {
  return fetch(LOCAL_DIR + 'drive.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(cfg => {
      if (!cfg.url) { driveNote = '（還沒接上 Drive）'; return []; }
      return fetch(cfg.url, { cache: 'no-store' })
        .then(r => { if (!r.ok) throw 0; return r.json(); })
        .then(j => {
          if (!j.ok) throw 0;
          driveNote = 'Drive 對照成功。';
          return (j.groups || []).map(g => ({
            name: g.name,
            files: (g.files || []).map(f => ({
              /* 子資料夾（例如「雙人照」）的圖，檔名前面補上資料夾名 →
                 它就會自成一個類別，控制台可以單獨調比例 */
              file: f.sub ? f.sub + ' ' + f.name : f.name,
              url: driveImgURL(f.id)
            }))
          }));
        });
    })
    .catch(() => { driveNote = 'Drive 這次沒讀到（不影響演出，用網站上的圖）。'; return []; });
}

/* 網站上的圖先載（快），Drive 晚點到再補——
   不能讓開場時 Drive 那 1～3 秒的等待，害第一下抽到火柴人 */
let ready = false;
let pendingDraw = false;

function 圖庫就緒() {
  ready = true;
  updateInfo();
  preload(lib());
  if (panel.style.display === 'block') refreshPanel();
  if (pendingDraw) { pendingDraw = false; onDraw(); }
  /* 稍後把其他回合的圖也偷偷載好，中場換回合才不會等 */
  setTimeout(() => preload(), 2500);
}

function loadLibraries() {
  const 本機 = loadLocal();
  const drive = loadDrive();
  return 本機.then(a => {
    assembleLibs(a, []);
    圖庫就緒();
    return drive.then(b => {
      const 現在第幾回合 = curLib;
      assembleLibs(a, b);
      if (現在第幾回合 < LIBS.length) curLib = 現在第幾回合;
      updateInfo();
      preload(lib());
      if (panel.style.display === 'block') refreshPanel();
    });
  });
}

/* ===== 抽籤池 ===== */
const lib = () => LIBS[curLib] || { name: '動作', poses: POSES, stick: true };
const pool = () => lib().poses;
const cats = () => [...new Set(pool().map(p => p.cat))];

/* ===== 洗牌式抽籤 =====
   把該回合的圖當成一副牌洗好，一張一張發，發完才重新洗。
   所以同一回合裡每張圖最多出現一次（圖比回合張數少時才會洗第二副）。
   「出現比例」還是有用：權重高的類別會被洗到比較前面，等於在一回合裡更早出現。 */
let lastPose = null;

function 洗牌(l) {
  let src = l.poses.filter(p => weightOf(p) > 0);
  if (!src.length) src = l.poses;                 /* 防呆：比例全歸零就無視比例 */
  l.deck = src
    .map(p => ({ p, k: -Math.log(Math.random() || 1e-9) / (weightOf(p) || 1e-9) }))
    .sort((a, b) => a.k - b.k)
    .map(x => x.p);
}

function drawPose() {
  const l = lib();
  if (!l.deck || !l.deck.length) 洗牌(l);
  let pick = l.deck.shift();
  /* 剛洗完的第一張如果跟上一張一樣，跟下一張換位子，看起來才不像卡住 */
  if (pick === lastPose && l.deck.length) {
    const alt = l.deck.shift();
    l.deck.unshift(pick);
    pick = alt;
  }
  lastPose = pick;
  return pick;
}

function mediaHTML(p) {
  return p.src === 'photo'
    ? `<img src="${p.url}" alt="" loading="lazy">`
    : figureSVG(p);
}

/* 開場先把當回合的圖偷偷載好，抽的時候才不會等 */
function preload(l) {
  (l ? [l] : LIBS).forEach(x => x.poses.forEach(p => {
    if (p.src === 'photo' && !p.pre) { p.pre = new Image(); p.pre.src = p.url; }
  }));
}

/* ===== 畫面更新 ===== */
const intro = document.getElementById('intro');
const drawview = document.getElementById('drawview');
const posebox = document.getElementById('posebox');
const endview = document.getElementById('endview');
const goBtn = document.getElementById('go');
const endBtn = document.getElementById('end');
const nextBtn = document.getElementById('next');
const roundInfo = document.getElementById('round-info');
let currentPose = null;

function onDraw() {
  if (roundEnded) return;
  /* 圖庫還沒載好就先記著，載好立刻補抽——不會讓人抽到還沒被取代的火柴人 */
  if (!ready) {
    pendingDraw = true;
    roundInfo.textContent = '圖庫載入中⋯⋯';
    return;
  }
  if (drawsThisRound >= roundLen) { endRound(); return; }
  intro.style.display = 'none';
  drawview.style.display = 'flex';
  currentPose = drawPose();
  posebox.innerHTML = mediaHTML(currentPose);
  posebox.classList.remove('pop');
  void posebox.offsetWidth;
  posebox.classList.add('pop');
  drawsThisRound++;
  updateInfo();
}

function updateInfo() {
  const head = '第 ' + (curLib + 1) + ' 回合「' + lib().name + '」';
  roundInfo.textContent = drawsThisRound
    ? head + '　第 ' + drawsThisRound + ' / ' + roundLen + ' 個'
    : head;
}

function endRound() {
  if (roundEnded) return;
  roundEnded = true;
  intro.style.display = 'none';
  drawview.style.display = 'none';
  endview.style.display = 'flex';
  endview.classList.remove('pop');
  void endview.offsetWidth;
  endview.classList.add('pop');
  goBtn.style.display = 'none';
  endBtn.style.display = 'none';
  nextBtn.style.display = '';
  const nx = LIBS[(curLib + 1) % LIBS.length];
  document.getElementById('end-sub').textContent =
    LIBS.length > 1 ? '按空白鍵開始下一回合：' + nx.name : '按空白鍵開始下一回合';
  roundInfo.textContent = '第 ' + (curLib + 1) + ' 回合結束';
}

/* 下一回合＝下一個圖庫（最後一個之後繞回第一個） */
function startNextRound() {
  roundEnded = false;
  drawsThisRound = 0;
  curLib = (curLib + 1) % LIBS.length;
  lib().deck = null;          /* 新回合重新洗牌 */
  lastPose = null;
  preload(lib());
  endview.style.display = 'none';
  nextBtn.style.display = 'none';
  goBtn.style.display = '';
  endBtn.style.display = '';
  onDraw();
}

goBtn.addEventListener('click', () => { onDraw(); goBtn.blur(); });
endBtn.addEventListener('click', () => { endRound(); endBtn.blur(); });
nextBtn.addEventListener('click', () => { startNextRound(); nextBtn.blur(); });
window.addEventListener('keydown', e => {
  if (panel.style.display === 'block') return;
  if (listBox.style.display === 'block') {
    if (e.code === 'Escape') closeList();
    return;
  }
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    if (roundEnded) startNextRound(); else onDraw();
  } else if (e.code === 'Enter' && !e.repeat) {
    e.preventDefault();
    if (!roundEnded) endRound();
  } else if (e.code === 'KeyF' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    toggleFullscreen();
  }
});

/* ===== 全螢幕 ===== */
/* iPhone 的 Safari 不支援網頁全螢幕 API，偵測不到就把整段入口藏起來 */
const fsBtn = document.getElementById('fs');
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
  document.getElementById('fs-wrap').style.display = 'none';
}
function toggleFullscreen() {
  const doc = document, root = doc.documentElement;
  if (doc.fullscreenElement || doc.webkitFullscreenElement) {
    (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
  } else {
    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
}
fsBtn.addEventListener('click', () => { toggleFullscreen(); fsBtn.blur(); });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    const on = document.fullscreenElement || document.webkitFullscreenElement;
    fsBtn.textContent = on ? '點我退出全螢幕（或按 Esc）' : '點我進入全螢幕';
  }));

/* ===== 動作清單（也是拍攝對照表） ===== */
const listBox = document.getElementById('list');
function renderList() {
  document.getElementById('list-note').innerHTML =
    `<b>一個資料夾＝一個回合。</b>圖片放在 Google Drive 的「看我動作片 圖片素材」底下，每個回合一個子資料夾。<br>` +
    `<b>演出前雙擊 <code>action-poses/收圖.command</code></b>：把 Drive 上的圖收進網站，現場就不靠網路。<br>` +
    `開頁時還是會跟 Drive 對照一次，<b>Drive 上有、網站上還沒有的會即時補進來</b>；讀不到就自動略過，用網站上的圖照跑。<br>` +
    `檔名寫成「<code>類別＋編號</code>」（例 <code>正經一.jpg</code>）會自動分類，控制台就能分別調比例；隨便命名也可以，那個回合就當成一類。<br>` +
    `<b>投影畫面上不會出現任何文字</b>，只有圖。<br>` +
    `<span style="opacity:.8">目前狀態：${libNote}${driveNote ? '　' + driveNote : ''}</span>`;

  document.getElementById('list-body').innerHTML = LIBS.map((l, i) => {
    const groups = {};
    l.poses.forEach(p => { (groups[p.cat] = groups[p.cat] || []).push(p); });
    return `<div class="lgroup" style="font-size:19px;color:#f0c894;padding-top:26px">` +
      `第 ${i + 1} 回合｜${l.name}（${l.stick ? '火柴人 ' + l.poses.length : l.poses.length + ' 張照片'}）</div>` +
      Object.keys(groups).map(cat =>
        (Object.keys(groups).length > 1 ? `<div class="lgroup">${cat}（${groups[cat].length}）</div>` : '') +
        `<div class="lgrid">` +
        groups[cat].map(p =>
          `<div class="lcard${p.src === 'photo' ? ' photo' : ''}">${mediaHTML(p)}` +
          `<div class="lname">${p.name || (p.file || '').replace(IMG_EXT, '') || p.cat}</div>` +
          `<div class="lsrc">${p.src === 'photo' ? (p.from === 'drive' ? '☁️ Drive' : '📷 網站') : '火柴人'}</div></div>`).join('') +
        `</div>`).join('');
  }).join('');
}
function closeList() { listBox.style.display = 'none'; }
document.getElementById('list-link').addEventListener('click', () => {
  renderList();
  listBox.style.display = 'block';
  listBox.scrollTop = 0;
});
document.getElementById('list-close').addEventListener('click', closeList);

/* ===== 控制台 ===== */
const panel = document.getElementById('panel');
const rowsBox = document.getElementById('panel-rows');

function refreshPanel() {
  const list = pool();
  const cs = cats();
  const count = {};
  cs.forEach(c => { count[c] = list.filter(p => p.cat === c).length; });
  rowsBox.innerHTML = cs.map(c =>
    `<div class="prow"><span class="gname" title="${c}">${c}</span>` +
    `<input type="range" min="0" max="3" step="0.05" value="${W[c] === undefined ? 1 : W[c]}" data-g="${c}">` +
    `<span class="gpct" id="pct-${c}"></span></div>`).join('');
  const total = cs.reduce((s, c) => s + count[c] * (W[c] === undefined ? 1 : W[c]), 0);
  cs.forEach(c => {
    const el = document.getElementById('pct-' + c);
    if (el) el.textContent = total > 0 ? (count[c] * (W[c] === undefined ? 1 : W[c]) / total * 100).toFixed(1) + '%' : '—';
  });
  document.getElementById('lib-btns').innerHTML = LIBS.map((l, i) =>
    `<button data-lib="${i}" class="${i === curLib ? 'on' : ''}" title="${l.name}">${i + 1}. ${l.name}</button>`).join('');
  document.getElementById('photo-status').textContent = libNote + (driveNote ? '　' + driveNote : '');
  document.getElementById('round-len').value = roundLen;
  document.getElementById('round-len-val').textContent = roundLen + ' 個';
}
document.getElementById('round-len').addEventListener('input', e => {
  roundLen = parseInt(e.target.value, 10);
  store.set('dongzuo-round-len', roundLen);
  document.getElementById('round-len-val').textContent = roundLen + ' 個';
  if (!roundEnded && drawsThisRound > 0) {
    roundInfo.textContent = '本回合第 ' + drawsThisRound + ' / ' + roundLen + ' 個';
  }
});
/* 控制台手動切回合（不用等抽完） */
document.getElementById('lib-btns').addEventListener('click', e => {
  const i = e.target.dataset ? e.target.dataset.lib : null;
  if (i === undefined || i === null) return;
  curLib = parseInt(i, 10);
  lib().deck = null;          /* 換回合重新洗牌 */
  lastPose = null;
  drawsThisRound = 0;
  roundEnded = false;
  endview.style.display = 'none';
  nextBtn.style.display = 'none';
  goBtn.style.display = '';
  endBtn.style.display = '';
  preload(lib());
  updateInfo();
  refreshPanel();
});
rowsBox.addEventListener('input', e => {
  if (e.target.dataset.g) {
    W[e.target.dataset.g] = parseFloat(e.target.value);
    store.set('dongzuo-weights', JSON.stringify(W));
    lib().deck = null;        /* 比例改了，剩下的牌重洗 */
    refreshPanel();
  }
});
document.getElementById('console-link').addEventListener('click', () => {
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  refreshPanel();
});
document.getElementById('font-btns').addEventListener('click', e => {
  const f = e.target.dataset ? e.target.dataset.f : null;
  if (f) { fontKey = f; store.set('dongzuo-font', f); applyFont(); }
});
document.getElementById('panel-close').addEventListener('click', () => { panel.style.display = 'none'; });
document.getElementById('panel-reset').addEventListener('click', () => {
  W = {};
  store.set('dongzuo-weights', '{}');
  lib().deck = null;
  refreshPanel();
});

/* ===== 套用字體 ===== */
function applyFont() {
  const F = FONTS[fontKey];
  document.documentElement.style.setProperty('--face', F.stack);
  document.documentElement.style.setProperty('--fw', F.weight);
  document.querySelectorAll('#font-btns button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === fontKey));
}
applyFont();

/* ===== 開場就去組圖庫（網站上的 ＋ Drive 補的） ===== */
assembleLibs([], []);
loadLibraries();
</script>
</body>
</html>
