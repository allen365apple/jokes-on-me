<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看我戀愛｜觀眾投稿</title><link rel="stylesheet" href="forms.css"></head><body><main><p class="muted">看我笑話工作室</p><h1>留下你的線索。</h1><p>你的答案可能出現在舞台上。照片請不要包含私人資訊。</p><p id="status"></p><section id="questionEditor" class="question-editor" hidden><div class="question-editor-heading"><strong>編輯題目</strong><a href="submit.html">離開編輯</a></div><p class="muted">題目會儲存在這台裝置；儲存後重新整理仍會保留。</p><div id="questionEditorFields"></div><div class="question-editor-actions"><button type="button" id="saveQuestions" class="primary">儲存題目</button><button type="button" id="resetQuestions">恢復預設</button></div><p id="questionSaveStatus" role="status"></p></section><form id="form"><label for="table" data-question="table">1. 你坐哪桌？</label><input id="table" required maxlength="12" placeholder="例如 B1"><label for="nick" data-question="nick">2. 你的暱稱？</label><input id="nick" required data-limit="8" autocomplete="off"><label data-question="tags">3. 請想著一位你身邊的長輩，寫下他的三個 #標籤</label><div class="tags"><label class="tag-input">#<input id="tag1" required data-limit="10" aria-label="第一個標籤"></label><label class="tag-input">#<input id="tag2" required data-limit="10" aria-label="第二個標籤"></label><label class="tag-input">#<input id="tag3" required data-limit="10" aria-label="第三個標籤"></label></div><label for="romanticGesture" data-question="romanticGesture">4. 曖昧對象做什麼行為，你會直接冷掉？</label><input id="romanticGesture" required data-limit="24"><label for="photo" data-question="photo">5. 你手機相簿裡的一張照片</label><input id="photo" type="file" accept="image/*" required><img id="photoPreview" hidden alt="照片預覽"><label for="awkwardLine" data-question="awkwardLine">6. 你聽過最尷尬的一句話是？</label><input id="awkwardLine" required data-limit="24"><label for="location" data-question="location">7. 你最想把討厭的人送去哪裡？</label><input id="location" required data-limit="20"><label for="igStory" data-question="igStory">8. 寫下你只敢發給摯友看的一句話</label><input id="igStory" required data-limit="30"><button class="primary" id="submitBtn">送出紙條</button><p id="error" role="status"></p></form><section id="done" hidden><h2>紙條收到了。</h2><p>接下來，交給舞台。</p><button id="again">再投一份</button></section></main><script src="firebase-config.js?v=20260919-firebase-live1"></script><script src="questions.js"></script><script src="core.js"></script><script src="store.js?v=20260919-firebase-live1"></script><script src="submit.js"></script></body></html>
